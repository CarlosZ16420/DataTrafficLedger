name: Windows build and portable release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Verify the dashboard in isolated Chrome
        shell: pwsh
        run: |
          $fixtureData = Join-Path $PWD 'tests/live-ci'
          $fixture = Start-Process -FilePath "$PWD/dist/LedgerTests.exe" -ArgumentList @('--serve-fixture', ('"' + $fixtureData + '"')) -WindowStyle Hidden -PassThru
          try {
            for ($attempt = 0; $attempt -lt 100 -and -not (Test-Path "$fixtureData/runtime.json"); $attempt++) { Start-Sleep -Milliseconds 100 }
            python tests/browser_check.py $fixtureData
            if ($LASTEXITCODE -ne 0) { throw 'Dashboard browser verification failed' }
          } finally {
            if (Test-Path "$fixtureData/runtime.json") {
              $state = [IO.File]::ReadAllText("$fixtureData/runtime.json") | ConvertFrom-Json
              Invoke-RestMethod -Uri ('http://127.0.0.1:' + $state.port + '/api/quit') -Method Post -Headers @{Cookie=('ledger_session=' + $state.token);'X-Ledger-Token'=$state.token} -NoProxy -TimeoutSec 10 | Out-Null
            }
            if (-not $fixture.WaitForExit(10000)) { $fixture.Kill() }
          }
      - name: Create clean portable package
        shell: pwsh
        run: |
          $releaseVersion = '1.5.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$releaseVersion") { throw 'Update the version before tagging.' }
          ./package.ps1 -Version $releaseVersion -SkipBuild
      - name: Verify extraction and portable data migration
        shell: pwsh
        run: ./tests/portable_check.ps1
      - name: Verify isolated uninstall and task cleanup
        shell: pwsh
        run: ./tests/uninstall_check.ps1
      - name: Publish public tagged release
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'CarlosZ16420/LocalTrafficLedger'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; keeping its verified assets.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME releases/*.zip releases/*.sha256 --verify-tag --title "Local Traffic Ledger $env:GITHUB_REF_NAME" --generate-notes
