name: Windows build and portable release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Create clean portable package
        shell: pwsh
        run: |
          $releaseVersion = '1.2.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$releaseVersion") { throw 'Update the version before tagging.' }
          ./package.ps1 -Version $releaseVersion -SkipBuild
      - name: Publish public tagged release
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'CarlosZ16420/LocalTrafficLedger'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; keeping its verified assets.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME releases/*.zip releases/*.sha256 --verify-tag --title "本机流量账本 $env:GITHUB_REF_NAME" --generate-notes
